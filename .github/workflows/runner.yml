name: VERB Runner

# Compila el VERB Runner (Tauri) de VERB Studio para Windows, macOS y Linux. El código del Runner NO está en este repo: vive en el repo
# privado de VERB Studio y aquí se descarga solo mientras dura la compilación (clave de solo lectura). Solo se publican los binarios.
# Solo manual (nunca en PR ni en push): así nadie de fuera puede lanzarlo.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   STUDIO_DEPLOY_KEY  clave SSH privada cuya parte pública está como «deploy key» de solo lectura en el repo de VERB Studio.
#   RUNNER_KEY_JSON    contenido de .secrets/runner-key-r1.json de VERB Studio (la clave base del Runner).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del Runner a publicar (p. ej. 0.1.0). Vacío = solo compilar y guardar artefactos, sin Release.'
        required: false
        default: ''

permissions:
  contents: read

env:
  STUDIO_REPO: bbxtudios/adventure-generator

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: verb-runner-windows.exe
          - os: macos-latest
            out: verb-runner-macos
          - os: ubuntu-latest
            out: verb-runner-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.STUDIO_REPO }}
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          path: studio
          fetch-depth: 1
      - name: Carpeta dist del Runner (en VERB Studio está en .gitignore y Tauri la exige)
        run: |
          mkdir -p studio/apps/runner/dist
          echo '<!doctype html><title>VERB Runner</title>' > studio/apps/runner/dist/index.html
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf
      - name: Clave del Runner
        run: |
          umask 077
          printf '%s' "$RUNNER_KEY_JSON" > "$RUNNER_TEMP/runner-key.json"
          echo "VERB_RUNNER_KEY_FILE=$RUNNER_TEMP/runner-key.json" >> "$GITHUB_ENV"
        env:
          RUNNER_KEY_JSON: ${{ secrets.RUNNER_KEY_JSON }}
      - name: Compilar (macOS y Linux)
        if: runner.os != 'Windows'
        working-directory: studio
        run: |
          node scripts/runner-prebuilt.mjs
          mkdir -p ../out
          cp "apps/runner/prebuilt/${{ matrix.out }}" "../out/${{ matrix.out }}"
      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        working-directory: studio
        run: |
          cargo build -p verb-runner --release
          mkdir -p ../out
          cp target/release/verb-runner.exe "../out/${{ matrix.out }}"
      - name: Borrar la clave del disco
        if: always()
        run: rm -f "$RUNNER_TEMP/runner-key.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
          if-no-files-found: error

  release:
    if: inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Sumas SHA-256
        working-directory: artifacts
        run: sha256sum verb-runner-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: runner-v${{ inputs.version }}
          name: VERB Runner ${{ inputs.version }}
          files: artifacts/*
          make_latest: false  # «latest» es solo para la carcasa del editor (editor-v*)
