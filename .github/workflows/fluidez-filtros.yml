name: Fluidez de los filtros de pantalla

# Mide en macOS y Linux, con las máquinas de GitHub, cuánto cuesta el filtro CRT del plugin «Filtros de pantalla» de VERB Studio: sin filtro,
# CRT completo y CRT ligero, y qué decide el «vigilante de fluidez». El código de VERB Studio NO está en este repo: se descarga solo mientras
# dura la prueba (clave de solo lectura) y el script que mide vive allí (`apps/studio/e2e/filtros-fluidez.mjs`). Aquí solo se lanza y se
# recogen los resultados. No publica ninguna Release. Solo manual.
#
# OJO con los números: las máquinas de GitHub no tienen tarjeta gráfica (Linux pinta por software y las de macOS tienen una GPU virtualizada),
# así que los fps absolutos NO son los de un equipo real; sirven como coste RELATIVO entre los tres casos y para ver qué decide el vigilante.
#
# Contrato con el script (lo escribe la sesión de VERB Studio):
#   node apps/studio/e2e/filtros-fluidez.mjs --browser=<webkit|chromium> --json=<ruta.json>
#   → escribe un JSON con los fps/tirones de «sin filtro», «CRT completo» y «CRT ligero» y la decisión del vigilante; sale con 0 si midió
#     (aunque vaya mal) y con otro código solo si no pudo medir.
#
# Secreto necesario: STUDIO_DEPLOY_KEY (la misma deploy key de solo lectura que usan runner.yml y builder.yml).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o commit de VERB Studio a medir (vacío = main).'
        required: false
        default: ''

permissions:
  contents: read

env:
  STUDIO_REPO: bbxtudios/adventure-generator

jobs:
  medir:
    name: ${{ matrix.os }} · ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, browser: webkit }
          - { os: macos-latest, browser: chromium }
          - { os: ubuntu-22.04, browser: chromium }
          - { os: ubuntu-22.04, browser: webkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.STUDIO_REPO }}
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          path: studio
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Navegador de Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Medir
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node apps/studio/e2e/filtros-fluidez.mjs --browser=${{ matrix.browser }} --json="$RUNNER_TEMP/out/fluidez-${{ matrix.os }}-${{ matrix.browser }}.json"
      - name: Resumen
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} · ${{ matrix.browser }}"
            echo '```json'
            cat "$RUNNER_TEMP"/out/*.json 2>/dev/null || echo '(sin resultados)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fluidez-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/out/*.json
          if-no-files-found: warn
