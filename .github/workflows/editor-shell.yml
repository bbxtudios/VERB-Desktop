name: Editor de escritorio

# Compila la carcasa Electron en Windows, macOS y Linux. En cada push/PR que toque editor-shell/ solo comprueba y empaqueta;
# con una etiqueta editor-v* (p. ej. editor-v0.1.0) además crea una Release con los instaladores.
# Sin firmar todavía: los certificados (Windows) y la notarización (Apple) irán como secretos de GitHub, nunca en el repo.

on:
  push:
    branches: [main]
    paths: ['editor-shell/**', '.github/workflows/editor-shell.yml']
    tags: ['editor-v*']
  pull_request:
    paths: ['editor-shell/**', '.github/workflows/editor-shell.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editor-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-shell/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # La prueba de humo abre una ventana: en Linux hace falta una pantalla virtual.
      - name: Prueba de humo (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - name: Prueba de humo
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.os }}
          path: |
            editor-shell/release/*.exe
            editor-shell/release/*.dmg
            editor-shell/release/*.AppImage
            editor-shell/release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/editor-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
