name: VERB Runner Android

# Compila la PLANTILLA del VERB Runner Android (Tauri Android) de VERB Studio: un APK y un AAB de release SIN ningún juego dentro, para
# arm64-v8a, armeabi-v7a y x86_64. El VERB Builder los lleva dentro (los mismos dos archivos en sus versiones de Windows, macOS y Linux) y con
# ellos monta el APK/AAB firmado de cada juego. El código NO está en este repo: vive en el repo privado de VERB Studio y aquí se descarga solo
# mientras dura la compilación (clave de solo lectura). Solo manual (nunca en PR ni en push).
#
# Publica una Release «runner-android-v<versión>» (no empieza por «runner-v», así que builder.yml no la confunde con los Runners de escritorio
# ni es la `latest` de la carcasa) con: verb-runner-android.apk, verb-runner-android.aab y SHA256SUMS.txt.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   STUDIO_DEPLOY_KEY          clave SSH privada (deploy key de solo lectura en el repo de VERB Studio).
#   RUNNER_ANDROID_KEY_JSON    contenido de .secrets/runner-key-android-1.json de VERB Studio (la clave del Runner ANDROID).
#                              NO es RUNNER_KEY_JSON (esa es la de escritorio) y no deben mezclarse nunca.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la plantilla a publicar (p. ej. 0.1.0). Vacío = solo compilar y guardar artefactos, sin Release.'
        required: false
        default: ''

permissions:
  contents: read

env:
  STUDIO_REPO: bbxtudios/adventure-generator
  NDK_VERSION: 28.2.13676358   # NDK r28c

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.STUDIO_REPO }}
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          path: studio
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - name: Android SDK y NDK
        run: |
          # La imagen ya trae el SDK en $ANDROID_HOME; se asegura la plataforma, las build-tools y el NDK r28.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Dependencias de VERB Studio
        working-directory: studio
        run: pnpm install --frozen-lockfile
      - name: Carpeta dist del Runner (en VERB Studio está en .gitignore y Tauri la exige)
        run: |
          mkdir -p studio/apps/runner/dist
          echo '<!doctype html><title>VERB Runner</title>' > studio/apps/runner/dist/index.html
      - name: Clave del Runner Android
        run: |
          [ -n "$RUNNER_ANDROID_KEY_JSON" ] || { echo "Falta el secreto RUNNER_ANDROID_KEY_JSON (la clave del Runner Android, no la de escritorio)."; exit 1; }
          umask 077
          printf '%s' "$RUNNER_ANDROID_KEY_JSON" > "$RUNNER_TEMP/runner-key-android.json"
          echo "VERB_RUNNER_KEY_FILE=$RUNNER_TEMP/runner-key-android.json" >> "$GITHUB_ENV"
        env:
          RUNNER_ANDROID_KEY_JSON: ${{ secrets.RUNNER_ANDROID_KEY_JSON }}
      - name: Compilar la plantilla (APK y AAB)
        working-directory: studio
        run: |
          pnpm runner:android
          mkdir -p ../out
          cp apps/runner/prebuilt/verb-runner-android.apk apps/runner/prebuilt/verb-runner-android.aab ../out/
          ls -l ../out
      - name: Borrar la clave del disco
        if: always()
        run: rm -f "$RUNNER_TEMP/runner-key-android.json"
      - uses: actions/upload-artifact@v7
        with:
          name: verb-runner-android
          path: |
            out/verb-runner-android.apk
            out/verb-runner-android.aab
          if-no-files-found: error

  release:
    if: inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Sumas SHA-256
        working-directory: artifacts
        run: sha256sum verb-runner-android.apk verb-runner-android.aab > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: runner-android-v${{ inputs.version }}
          name: VERB Runner Android ${{ inputs.version }}
          files: artifacts/*
          make_latest: false  # «latest» es solo para la carcasa del editor (editor-v*)
